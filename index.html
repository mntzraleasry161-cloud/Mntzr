<!DOCTYPE html>

<title>Monster Chess 3D</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:radial-gradient(circle at top,#28583a,#102b20 60%,#07140f);
 color:white;
 font-family:Cairo,Arial,sans-serif;
 text-align:center;
 min-height:100vh;
}

header{
 padding:20px 10px 12px;
 background:linear-gradient(135deg,#173d2b,#0b2118);
 border-bottom:2px solid #c4a45a;
 box-shadow:0 5px 25px #0009;
}

h1{
 margin:0;
 font-size:clamp(23px,6vw,38px);
 color:#d8c17a;
 text-shadow:0 0 15px #b7a04e;
}

.subtitle{color:#b9d3a9;font-size:13px}

.section{
 width:min(95%,850px);
 margin:22px auto;
 padding:20px 14px;
 border:1px solid #71956c88;
 border-radius:22px;
 background:linear-gradient(145deg,#ffffff12,#ffffff04);
 box-shadow:0 10px 35px #0007,inset 0 0 20px #315c3922;
}

.section-title{color:#d8c17a;font-size:18px;font-weight:900;margin:10px 0 18px}

.buttons{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}

.btn{
 position:relative;overflow:hidden;cursor:pointer;
 border:2px solid #c4a45a;border-radius:13px;
 min-width:135px;padding:13px 18px;color:white;
 font-family:inherit;font-weight:900;font-size:15px;
 text-shadow:0 2px 4px #0009;
 box-shadow:inset 0 3px 5px #ffffff44,inset 0 -5px 8px #0007,0 6px 12px #0008;
 transition:.15s;
}

.btn:before{
 content:"";position:absolute;top:0;left:10%;width:80%;height:45%;
 background:linear-gradient(#ffffff55,transparent);
 border-radius:0 0 50% 50%;pointer-events:none;
}

.btn:active{transform:translateY(4px)}

.gold{background:linear-gradient(#e8d18a,#a98a3c,#665020);color:#241d0c}
.green{background:linear-gradient(#65a96c,#28643b,#123b26)}
.purple{background:linear-gradient(#657d67,#344d3a,#192d20)}
.blue{background:linear-gradient(#6caa91,#34765d,#174a36)}
.red{background:linear-gradient(#a85b4c,#71352c,#3d1b19)}
.orange{background:linear-gradient(#b99a58,#77602c,#453719)}

.large{width:min(90%,340px);padding:18px;font-size:22px;border-radius:35px}
.small{min-width:110px;font-size:13px;padding:10px}

#gameScreen{display:none}

#game{
 width:100%;height:55vh;min-height:340px;max-height:620px;
 touch-action:none;overflow:hidden;border-radius:15px;
}

#game canvas{display:block}

.game-panel{
 width:min(96%,800px);margin:15px auto;padding:13px;
 background:linear-gradient(145deg,#1b3828,#10251b);
 border:1px solid #71956c77;border-radius:18px;
}

#status{color:#d5dca1;font-weight:900;font-size:16px;margin:10px}

#moves{
 max-height:65px;overflow:auto;color:#d4e1ce;font-size:12px;
 overflow-wrap:anywhere;margin-top:12px;
}

select{
 background:#193d2b;color:white;border:1px solid #c4a45a;border-radius:10px;
 padding:10px;font-family:inherit;font-weight:bold;
}

#promotion{display:none;padding:12px;background:#244832;border-radius:12px;margin:10px}

#settings{
 display:none;position:fixed;inset:0;z-index:10;background:#000b;
 justify-content:center;align-items:center;padding:15px;
}

.modal{
 width:min(95%,400px);
 background:linear-gradient(145deg,#315b3c,#10271b);
 border:2px solid #c4a45a;border-radius:20px;padding:22px;
 box-shadow:0 0 35px #000;
}

.setting-row{
 display:flex;justify-content:space-between;align-items:center;
 padding:12px 0;border-bottom:1px solid #ffffff22;
}

input[type=checkbox]{width:22px;height:22px;accent-color:#c4a45a}

#notice{color:#d8c17a;min-height:25px;font-size:13px;margin:8px}

.footer{color:#a9bba5;font-size:11px;padding:15px}
</style>
</head>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "OrbitControls":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js"
 }
}
</script>

<script type="module">

import * as THREE from "three";
import {OrbitControls} from "OrbitControls";
import {Chess} from "chess";

const chess = new Chess();
const holder = document.getElementById("game");

let selected = null;
let thinking = false;
let pendingPromotion = null;
let gameStarted = false;
let initialized = false;

const files = "abcdefgh";

/* ============================================================
   أدوات مساعدة عامة
   ============================================================ */

function position(square){
 return {
  x: files.indexOf(square[0]) - 3.5,
  z: 4.5 - Number(square[1])
 };
}

function sound(){
 if(!document.getElementById("sound").checked) return;
 try{
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if(!AudioContext) return;
  const ctx = new AudioContext();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.frequency.value = 650;
  gain.gain.setValueAtTime(.07, ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .12);
  osc.start();
  osc.stop(ctx.currentTime + .12);
  osc.onended = () => ctx.close();
 }catch(e){}
}

function notice(msg){
 document.getElementById("notice").textContent = msg;
}

window.comingSoon = function(name){
 sound();
 notice("✨ " + name + " - قريباً في تحديث جديد!");
};

window.openSettings = function(){
 sound();
 document.getElementById("settings").style.display = "flex";
};

window.closeSettings = function(){
 sound();
 document.getElementById("settings").style.display = "none";
};

/* ============================================================
   المشهد ثلاثي الأبعاد
   ============================================================ */

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10251a);
scene.fog = new THREE.Fog(0x10251a, 17, 35);

const camera = new THREE.PerspectiveCamera(45, 1, .1, 100);
camera.position.set(3, 10, 12);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

holder.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 20;
controls.maxPolarAngle = Math.PI / 2.15;

scene.add(new THREE.HemisphereLight(0xd6efcf, 0x172b1c, 2));

const sun = new THREE.DirectionalLight(0xffe8bd, 3);
sun.position.set(5, 10, 7);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
scene.add(sun);

const greenLight = new THREE.PointLight(0x3dff85, 1.3, 15);
greenLight.position.set(-5, 4, -4);
scene.add(greenLight);

const floor = new THREE.Mesh(
 new THREE.PlaneGeometry(200, 200),
 new THREE.MeshStandardMaterial({ color: 0x10291b, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -.7;
floor.receiveShadow = true;
scene.add(floor);

/* ============================================================
   قاعدة الشطرنج والحواف
   ============================================================ */

const base = new THREE.Mesh(
 new THREE.BoxGeometry(8.7, .65, 8.7),
 new THREE.MeshStandardMaterial({ color: 0x263d2a, metalness: .45, roughness: .4 })
);
base.position.y = -.4;
base.receiveShadow = true;
scene.add(base);

const trimMaterial = new THREE.MeshStandardMaterial({ color: 0xc4a45a, metalness: .75, roughness: .25 });

function addTrim(x, z, sx, sz){
 const m = new THREE.Mesh(new THREE.BoxGeometry(sx, .13, sz), trimMaterial);
 m.position.set(x, .045, z);
 m.castShadow = true;
 scene.add(m);
}

addTrim(0, 4.12, 8.35, .13);
addTrim(0, -4.12, 8.35, .13);
addTrim(4.12, 0, .13, 8.35);
addTrim(-4.12, 0, .13, 8.35);

const board = new THREE.Group();
scene.add(board);

const pieces = new THREE.Group();
scene.add(pieces);

const squares = [];

/* ============================================================
   إنشاء الرقعة
   ============================================================ */

function makeBoard(){
 for(let rank = 8; rank >= 1; rank--){
  for(let f = 0; f < 8; f++){
   const s = files[f] + rank;
   const p = position(s);
   const light = (rank + f) % 2 === 0;

   const mat = new THREE.MeshStandardMaterial({
    color: light ? 0x9dbb77 : 0x345a3b,
    roughness: .75,
    metalness: .05
   });

   const mesh = new THREE.Mesh(new THREE.BoxGeometry(.99, .15, .99), mat);
   mesh.position.set(p.x, -.035, p.z);
   mesh.receiveShadow = true;
   mesh.castShadow = true;
   mesh.userData.square = s;

   board.add(mesh);
   squares.push(mesh);
  }
 }
}

/* ============================================================
   إدارة الموارد المشتركة (Geometries + Materials)
   ============================================================ */

const geoCache = new Map();
const matCache = new Map();

function geo(key, factory){
 if(!geoCache.has(key)) geoCache.set(key, factory());
 return geoCache.get(key);
}

function mat(key, factory){
 if(!matCache.has(key)) matCache.set(key, factory());
 return matCache.get(key);
}

function getGeoSphere(){ return geo('sphere', () => new THREE.SphereGeometry(1, 20, 16)); }
function getGeoCone(){ return geo('cone', () => new THREE.ConeGeometry(1, 1, 14)); }
function getGeoBox(){ return geo('box', () => new THREE.BoxGeometry(1, 1, 1)); }
function getGeoCyl(rt, rb, h){
 const k = `cyl_${rt}_${rb}_${h}`;
 return geo(k, () => new THREE.CylinderGeometry(rt, rb, h, 16));
}

function getMats(color){
 const isW = color === "w";
 return {
  main: mat(`main_${color}`, () => new THREE.MeshStandardMaterial({
   color: isW ? 0x4a8c5c : 0x323c34, roughness: .35, metalness: .2
  })),
  skin: mat(`skin_${color}`, () => new THREE.MeshStandardMaterial({
   color: isW ? 0x7db868 : 0x5a6450, roughness: .55
  })),
  eye: mat(`eye_${color}`, () => new THREE.MeshStandardMaterial({
   color: isW ? 0x9dff4e : 0xff3b20,
   emissive: isW ? 0x42ff00 : 0xff1600,
   emissiveIntensity: 2.2
  })),
  dark: mat('dark', () => new THREE.MeshStandardMaterial({ color: 0x101710, roughness: .8 })),
  gold: mat('gold', () => new THREE.MeshStandardMaterial({ color: 0xc9a64c, metalness: .8, roughness: .22 })),
  bone: mat('bone', () => new THREE.MeshStandardMaterial({ color: 0xe3d9b8, roughness: .5 })),
  armor: mat('armor', () => new THREE.MeshStandardMaterial({ color: 0x455c3b, metalness: .85, roughness: .28 }))
 };
}

/* ============================================================
   بناء قطع الشطرنج (بنفس التصميم والمواد)
   ============================================================ */

function chessPiece(type, color){
 const g = new THREE.Group();
 const M = getMats(color);

 function sphere(x, y, z, sx, sy, sz, m){
  const mesh = new THREE.Mesh(getGeoSphere(), m);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  g.add(mesh);
  return mesh;
 }

 function cone(x, y, z, r, h, m, rx = 0, rz = 0){
  const mesh = new THREE.Mesh(getGeoCone(), m);
  mesh.position.set(x, y, z);
  mesh.scale.set(r, h, r);
  mesh.rotation.x = rx;
  mesh.rotation.z = rz;
  mesh.castShadow = true;
  g.add(mesh);
  return mesh;
 }

 function box(x, y, z, sx, sy, sz, m){
  const mesh = new THREE.Mesh(getGeoBox(), m);
  mesh.position.set(x, y, z);
  mesh.scale.set(sx, sy, sz);
  mesh.castShadow = true;
  g.add(mesh);
  return mesh;
 }

 function cylinder(x, y, z, rt, rb, h, m){
  const mesh = new THREE.Mesh(getGeoCyl(rt, rb, h), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  g.add(mesh);
  return mesh;
 }

 /* القاعدة المشتركة لكل القطع */
 cylinder(0, 0.06, 0, 0.42, 0.46, 0.12, M.main);
 cylinder(0, 0.14, 0, 0.36, 0.42, 0.06, M.gold);
 cylinder(0, 0.19, 0, 0.32, 0.36, 0.04, M.main);

 /* ============ البيدق ============ */
 if(type === "p"){
  sphere(0, 0.35, 0, 0.20, 0.16, 0.20, M.main);
  cylinder(0, 0.48, 0, 0.12, 0.16, 0.12, M.gold);
  sphere(0, 0.70, 0, 0.19, 0.21, 0.19, M.skin);
  sphere(0, 0.88, 0, 0.06, 0.06, 0.06, M.eye);
 }

 /* ============ القلعة ============ */
 if(type === "r"){
  cylinder(0, 0.55, 0, 0.24, 0.32, 0.60, M.main);
  cylinder(0, 0.90, 0, 0.30, 0.26, 0.12, M.gold);
  for(let i = 0; i < 6; i++){
   const a = (Math.PI * 2 / 6) * i;
   box(Math.cos(a) * 0.24, 1.03, Math.sin(a) * 0.24, 0.12, 0.16, 0.12, M.gold);
  }
  sphere(0, 1.15, 0, 0.07, 0.07, 0.07, M.eye);
 }

 /* ============ الحصان ============ */
 if(type === "n"){
  cylinder(0, 0.35, 0, 0.22, 0.28, 0.30, M.main);
  sphere(0, 0.55, 0, 0.22, 0.20, 0.22, M.main);
  sphere(0, 0.78, 0.10, 0.18, 0.22, 0.20, M.skin);
  sphere(0, 0.92, 0.22, 0.14, 0.16, 0.18, M.skin);
  sphere(0, 0.88, 0.40, 0.11, 0.10, 0.12, M.skin);
  cone(-0.10, 1.10, 0.10, 0.05, 0.18, M.skin, 0, -0.15);
  cone(0.10, 1.10, 0.10, 0.05, 0.18, M.skin, 0, 0.15);
  sphere(-0.10, 0.98, 0.32, 0.04, 0.04, 0.02, M.eye);
  sphere(0.10, 0.98, 0.32, 0.04, 0.04, 0.02, M.eye);
  for(let i = 0; i < 3; i++){
   cone(0, 0.95 + i * 0.04, -0.08 - i * 0.05, 0.06, 0.14, M.dark, 0.3, 0);
  }
 }

 /* ============ الفيل ============ */
 if(type === "b"){
  cylinder(0, 0.40, 0, 0.18, 0.26, 0.30, M.main);
  sphere(0, 0.60, 0, 0.20, 0.14, 0.20, M.main);
  cylinder(0, 0.70, 0, 0.08, 0.15, 0.15, M.gold);
  cone(0, 0.95, 0, 0.18, 0.40, M.skin);
  sphere(0, 1.22, 0, 0.08, 0.08, 0.08, M.eye);
  box(0, 0.95, 0.14, 0.02, 0.15, 0.06, M.dark);
 }

 /* ============ الملكة ============ */
 if(type === "q"){
  cylinder(0, 0.45, 0, 0.20, 0.28, 0.35, M.main);
  sphere(0, 0.70, 0, 0.22, 0.12, 0.22, M.main);
  cylinder(0, 0.85, 0, 0.18, 0.20, 0.10, M.gold);
  for(let i = 0; i < 8; i++){
   const a = (Math.PI * 2 / 8) * i;
   cone(Math.cos(a) * 0.16, 1.03, Math.sin(a) * 0.16, 0.045, 0.20, M.gold);
  }
  sphere(0, 1.18, 0, 0.07, 0.07, 0.07, M.eye);
 }

 /* ============ الملك ============ */
 if(type === "k"){
  cylinder(0, 0.45, 0, 0.22, 0.30, 0.35, M.main);
  sphere(0, 0.70, 0, 0.24, 0.14, 0.24, M.main);
  cylinder(0, 0.88, 0, 0.20, 0.22, 0.14, M.gold);
  box(0, 1.15, 0, 0.05, 0.28, 0.05, M.eye);
  box(0, 1.20, 0, 0.20, 0.05, 0.05, M.eye);
 }

 return g;
}

/* ============================================================
   رسم القطع
   ============================================================ */

function draw(){
 pieces.clear();

 const state = chess.board();

 for(let r = 0; r < 8; r++){
  for(let f = 0; f < 8; f++){
   const p = state[r][f];
   if(!p) continue;

   const s = files[f] + (8 - r);
   const pos = position(s);

   const obj = chessPiece(p.type, p.color);
   obj.position.set(pos.x, 0.05, pos.z);
   obj.rotation.y = p.color === "w" ? Math.PI : 0;
   obj.userData.square = s;
   obj.userData.color = p.color;

   pieces.add(obj);
  }
 }
}

/* ============================================================
   تلوين الحركات + إبراز الملك المكشوش
   ============================================================ */

function resetColors(){
 squares.forEach(s => {
  const rank = Number(s.userData.square[1]);
  const f = files.indexOf(s.userData.square[0]);
  s.material.color.setHex((rank + f) % 2 === 0 ? 0x9dbb77 : 0x345a3b);
 });

 if(chess.isCheck()){
  const kingColor = chess.turn();
  const king = chess.board().flat().find(p => p && p.type === "k" && p.color === kingColor);
  if(king && king.square){
   const sq = squares.find(s => s.userData.square === king.square);
   if(sq) sq.material.color.setHex(0xd9534f);
  }
 }
}

function showMoves(from){
 resetColors();

 const moves = chess.moves({ square: from, verbose: true });

 moves.forEach(m => {
  const sq = squares.find(x => x.userData.square === m.to);
  if(sq) sq.material.color.setHex(0x8edb65);
 });
}

/* ============================================================
   حالة اللعبة
   ============================================================ */

function updateStatus(){
 const status = document.getElementById("status");

 if(chess.isCheckmate()){
  status.textContent = "🏆 كش مات! " + (chess.turn() === "w" ? "الأسود" : "الأبيض") + " فاز!";
  return true;
 }

 if(chess.isStalemate()){
  status.textContent = "🤝 تعادل بسبب الجمود!";
  return true;
 }

 if(chess.isDraw()){
  status.textContent = "🤝 المباراة انتهت بالتعادل";
  return true;
 }

 if(chess.isCheck()){
  status.textContent = "⚠️ كش! الملك مهدد";
  return false;
 }

 status.textContent = chess.turn() === "w"
  ? "دورك الآن - الأبيض"
  : "🤖 الكمبيوتر يفكر...";

 return false;
}

/* ============================================================
   تنفيذ الحركة
   ============================================================ */

function makeMove(from, to, promotion = "q"){
 try{
  const move = chess.move({ from, to, promotion });
  if(!move) return false;

  draw();
  resetColors();
  selected = null;

  document.getElementById("moves").textContent = chess.history().join("  ");
  sound();

  return true;
 }catch(e){
  return false;
 }
}

/* ============================================================
   تقييم اللوحة
   ============================================================ */

const PIECE_VALUES = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

function evaluateBoard(){
 if(chess.isCheckmate()){
  return chess.turn() === "w" ? 999999 : -999999;
 }
 if(chess.isDraw() || chess.isStalemate()) return 0;

 let score = 0;
 const b = chess.board();
 for(let r = 0; r < 8; r++){
  for(let f = 0; f < 8; f++){
   const p = b[r][f];
   if(!p) continue;
   const v = PIECE_VALUES[p.type];
   score += p.color === "w" ? -v : v;
  }
 }
 return score;
}

function minimax(depth, alpha, beta, isMax){
 if(depth === 0 || chess.isGameOver()) return evaluateBoard();

 const moves = chess.moves();

 if(isMax){
  let best = -Infinity;
  for(const m of moves){
   chess.move(m);
   const v = minimax(depth - 1, alpha, beta, false);
   chess.undo();
   if(v > best) best = v;
   if(best > alpha) alpha = best;
   if(beta <= alpha) break;
  }
  return best;
 } else {
  let best = Infinity;
  for(const m of moves){
   chess.move(m);
   const v = minimax(depth - 1, alpha, beta, true);
   chess.undo();
   if(v < best) best = v;
   if(best < beta) beta = best;
   if(beta <= alpha) break;
  }
  return best;
 }
}

/* ============================================================
   ذكاء الكمبيوتر
   ============================================================ */

function computerMove(){
 if(chess.isGameOver() || chess.turn() !== "b") return;

 thinking = true;
 document.getElementById("status").textContent = "🤖 الكمبيوتر يفكر...";

 setTimeout(() => {
  const level = document.getElementById("level").value;
  const depth = level === "easy" ? 1 : 3;

  const moves = chess.moves();
  let bestMove = null;
  let bestScore = -Infinity;

  for(const m of moves){
   chess.move(m);
   const v = minimax(depth - 1, -Infinity, Infinity, false);
   chess.undo();
   if(v > bestScore){
    bestScore = v;
    bestMove = m;
   }
  }

  if(bestMove){
   chess.move(bestMove);
   draw();
   resetColors();
   sound();
   document.getElementById("moves").textContent = chess.history().join("  ");
  }

  thinking = false;
  updateStatus();
 }, 250);
}

/* ============================================================
   النقر والتفاعل
   ============================================================ */

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

renderer.domElement.addEventListener("pointerdown", onPointerDown);

function onPointerDown(e){
 if(!gameStarted || thinking || pendingPromotion) return;
 if(chess.turn() !== "w" || chess.isGameOver()) return;

 const rect = renderer.domElement.getBoundingClientRect();
 mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
 mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

 raycaster.setFromCamera(mouse, camera);

 const pieceHits = raycaster.intersectObjects(pieces.children, true);
 const squareHits = raycaster.intersectObjects(squares);

 let square = null;

 if(pieceHits.length > 0){
  let obj = pieceHits[0].object;
  while(obj && !obj.userData.square) obj = obj.parent;
  if(obj) square = obj.userData.square;
 }
 if(!square && squareHits.length > 0){
  square = squareHits[0].object.userData.square;
 }
 if(!square) return;

 handleSquareClick(square);
}

function handleSquareClick(square){
 if(selected){
  const moves = chess.moves({ square: selected, verbose: true });
  const target = moves.find(m => m.to === square);

  if(target){
   if(target.flags.includes("p")){
    pendingPromotion = { from: selected, to: square };
    document.getElementById("promotion").style.display = "block";
    return;
   }
   makeMove(selected, square);
   updateStatus();
   if(!chess.isGameOver() && chess.turn() === "b") computerMove();
   return;
  }
 }

 const piece = chess.get(square);
 if(piece && piece.color === "w"){
  selected = square;
  showMoves(square);
  sound();
 } else {
  selected = null;
  resetColors();
 }
}

/* ============================================================
   أزرار التحكم
   ============================================================ */

window.startGame = function(){
 sound();
 document.getElementById("menuScreen").style.display = "none";
 document.getElementById("gameScreen").style.display = "block";
 gameStarted = true;

 if(!initialized){
  makeBoard();
  initialized = true;
 }

 chess.reset();
 selected = null;
 thinking = false;
 pendingPromotion = null;

 draw();
 resetColors();
 updateStatus();
 document.getElementById("promotion").style.display = "none";
 document.getElementById("moves").textContent = "سجل الحركات سيظهر هنا";

 setTimeout(onResize, 50);
};

window.newGame = function(){
 sound();
 chess.reset();
 selected = null;
 thinking = false;
 pendingPromotion = null;

 draw();
 resetColors();
 updateStatus();
 document.getElementById("promotion").style.display = "none";
 document.getElementById("moves").textContent = "سجل الحركات سيظهر هنا";
};

window.undoMove = function(){
 if(thinking) return;
 sound();
 if(chess.history().length < 2) return;

 chess.undo();
 chess.undo();

 selected = null;
 pendingPromotion = null;
 document.getElementById("promotion").style.display = "none";

 draw();
 resetColors();
 updateStatus();
 document.getElementById("moves").textContent = chess.history().join("  ") || "سجل الحركات سيظهر هنا";
};

window.backMenu = function(){
 sound();
 gameStarted = false;
 document.getElementById("gameScreen").style.display = "none";
 document.getElementById("menuScreen").style.display = "block";
};

window.promote = function(p){
 if(!pendingPromotion) return;
 sound();
 const { from, to } = pendingPromotion;
 pendingPromotion = null;
 document.getElementById("promotion").style.display = "none";

 makeMove(from, to, p);
 updateStatus();

 if(!chess.isGameOver() && chess.turn() === "b") computerMove();
};

/* ============================================================
   الحجم والحركة
   ============================================================ */

function onResize(){
 const w = holder.clientWidth || 800;
 const h = holder.clientHeight || 400;
 camera.aspect = w / h;
 camera.updateProjectionMatrix();
 renderer.setSize(w, h);
}

window.addEventListener("resize", onResize);
onResize();

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene, camera);
}

animate();

</script>
